name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Solidus ${{ matrix.solidus }} / Rails ${{ matrix.rails }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.3"
            solidus: "4.6"
            rails: "7.2"
          - ruby: "3.4"
            solidus: "4.6"
            rails: "7.2"
          - ruby: "3.4"
            solidus: "4.7"
            rails: "7.2"
          - ruby: "3.4"
            solidus: "4.7"
            rails: "8.0"
          - ruby: "4.0"
            solidus: "4.7"
            rails: "8.1"
          - ruby: "4.0"
            solidus: "4.8"
            rails: "8.1"
    runs-on: ubuntu-latest
    env:
      SOLIDUS_VERSION: ${{ matrix.solidus }}
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: ${{ matrix.solidus }}-rails-${{ matrix.rails }}
      - run: bin/rake extension:specs SPEC_OPTS="--exclude-pattern spec/system/**/*_spec.rb"
      - run: bundle exec bundle-audit check --update

  quality:
    runs-on: ubuntu-latest
    env:
      SOLIDUS_VERSION: "4.8"
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: quality-v4.8-rails-8.1
      - run: bundle exec rake quality:coverage
      - run: bundle exec rake quality:lint
      - name: Upload coverage to Codecov
        if: >-
          vars.CODECOV_ENABLED == 'true' &&
          !startsWith(github.ref, 'refs/tags/') &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov/solidus-weighted-shipping.lcov
          disable_search: true
          fail_ci_if_error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: weighted-shipping-browser-evidence
          path: tmp/screenshots/
          if-no-files-found: error
          retention-days: 14

  mutation:
    runs-on: ubuntu-latest
    env:
      SOLIDUS_VERSION: "4.8"
      RAILS_VERSION: "7.2"
      MUTANT_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          cache-version: mutation-ruby-3.3-v4.8-rails-7.2
      - run: bundle exec rake quality:mutation

  package:
    runs-on: ubuntu-latest
    env:
      SOLIDUS_VERSION: "4.8"
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: package-v4.8-rails-8.1
      - run: mkdir -p pkg
      - run: gem build solidus_weighted_shipping.gemspec --output pkg/solidus_weighted_shipping.gem
      - name: Inspect package metadata
        run: >-
          ruby -rrubygems/package
          -e 'spec = Gem::Package.new(ARGV.fetch(0)).spec; puts({name: spec.name, version: spec.version.to_s, ruby: spec.required_ruby_version.to_s})'
          pkg/solidus_weighted_shipping.gem
      - name: Install and load the packaged domain
        run: |
          package_home="$(mktemp -d)"
          gem install --local pkg/solidus_weighted_shipping.gem --install-dir "$package_home" --ignore-dependencies --no-document
          package_lib="$(find "$package_home/gems" -path '*/solidus_weighted_shipping-*/lib' -type d -print -quit)"
          ruby -I"$package_lib" -e 'require "solidus_weighted_shipping/domain"; abort unless SolidusWeightedShipping::RateTable.parse("1: 2").price_for("1") == 2'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solidus-weighted-shipping-gem
          path: pkg/solidus_weighted_shipping.gem
          if-no-files-found: error
          retention-days: 14

  solidus-edge:
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      SOLIDUS_BRANCH: main
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: solidus-main-rails-8.1
      - run: bin/rake extension:specs
